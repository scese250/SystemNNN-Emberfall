name: Build Android APK

'on':
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      movie_codec_linkage:
        description: 'FFmpeg linkage (shared or static)'
        required: false
        default: 'shared'
        type: choice
        options:
          - shared
          - static

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make curl util-linux

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            ndk;28.0.13004108

      - name: Configure Android NDK
        run: |
          NDK_PATH="${ANDROID_HOME}/ndk/28.0.13004108"
          if [ ! -d "$NDK_PATH" ]; then
            NDK_PATH=$(find "${ANDROID_HOME}/ndk" -maxdepth 1 -name "28.*" | head -n 1)
          fi
          echo "SYSTEMNNN_NDK=${NDK_PATH}" >> $GITHUB_ENV
          echo "Found NDK at ${NDK_PATH}"

      - name: Cache Movie Codec & FFmpeg Source
        uses: actions/cache@v4
        with:
          path: |
            build/tyranor/ffmpeg-8.1.3-source.tar.gz
            build/tyranor/movie-codec-arm64
          key: movie-codec-${{ runner.os }}-${{ inputs.movie_codec_linkage || 'shared' }}-8.1.3-${{ hashFiles('platform/android/build_movie_codec.sh') }}
          restore-keys: |
            movie-codec-${{ runner.os }}-${{ inputs.movie_codec_linkage || 'shared' }}-8.1.3-
            movie-codec-${{ runner.os }}-

      - name: Build APK
        run: |
          python3 platform/android/build_player.py --movie-codec-linkage "${{ inputs.movie_codec_linkage || 'shared' }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: systemnnn-emberfall-apk
          path: build/tyranor/*.apk
